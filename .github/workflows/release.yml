name: Production Release Pipeline

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Verify & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          registry-url: 'https://registry.npmjs.org'

      - name: Install Dependencies
        run: npm ci

      - name: Build CLI Bundle
        run: npm run build

      - name: Run Full Verification Gate
        run: |
          npm test
          npm run lint
          npm run verify

      - name: Generate Topology Manifest
        run: node ./cli/dist/index.mjs context generate

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            sagarithm.manifest.json
            registry/index.json
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node for GitHub Packages
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          registry-url: 'https://npm.pkg.github.com'
          scope: '@sagarithm'

      - name: Publish to GitHub Packages
        run: |
          node -e 'const fs=require("fs"); const pkg = JSON.parse(fs.readFileSync("package.json", "utf8")); pkg.name = "@sagarithm/sagarithm-kit"; pkg.publishConfig = { registry: "https://npm.pkg.github.com", access: "public" }; fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2));'
          npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
